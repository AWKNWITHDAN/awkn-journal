<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Internal Mastery</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
:root{
  --gold:#D4AF37; --gold-dim:rgba(212,175,55,0.15); --gold-soft:rgba(212,175,55,0.08);
  --charcoal:#303030; --ch2:#262626; --ch3:#1c1c1c; --surface:#393939;
  --muted:rgba(255,255,255,0.45); --text:rgba(255,255,255,0.88);
  --radius:12px; --radius-sm:8px; --locked:rgba(255,255,255,0.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--ch3);color:var(--text);font-family:'Open Sans',sans-serif;min-height:100vh;}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
.login-card{width:100%;max-width:400px;background:var(--ch2);border:1px solid rgba(212,175,55,0.2);border-radius:18px;padding:36px 32px;text-align:center;}
.login-card .eyebrow{font-size:10px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.login-card h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:28px;letter-spacing:-0.02em;margin-bottom:6px;}
.login-card h1 span{color:var(--gold);}
.login-card .login-sub{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.5;}
.form-group{text-align:left;margin-bottom:14px;}
.form-group label{display:block;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:6px;}
.form-group input{width:100%;background:var(--ch3);border:1px solid rgba(212,175,55,0.2);border-radius:var(--radius-sm);padding:13px 14px;color:var(--text);font-family:'Open Sans',sans-serif;font-size:15px;outline:none;transition:border-color 0.2s;}
.form-group input:focus{border-color:var(--gold);}
.login-err{font-size:13px;color:#e05a5a;margin-bottom:14px;min-height:18px;text-align:center;}
.btn-login{width:100%;background:var(--gold);color:var(--charcoal);border:none;border-radius:var(--radius-sm);padding:14px;font-family:'Open Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:background 0.18s;margin-top:4px;}
.btn-login:hover{background:#c9a42e;}
.btn-login:disabled{background:rgba(212,175,55,0.3);color:rgba(0,0,0,0.4);cursor:not-allowed;}

/* APP */
#appScreen{display:none;}
.site-header{background:var(--ch2);border-bottom:1px solid rgba(212,175,55,0.2);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.header-left .eyebrow{font-size:9px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
.header-left h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(17px,4vw,22px);letter-spacing:-0.02em;}
.header-left h1 span{color:var(--gold);}
.btn-logout{background:none;border:1px solid rgba(212,175,55,0.25);color:var(--muted);font-family:'Open Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:7px 13px;border-radius:6px;cursor:pointer;transition:all 0.18s;white-space:nowrap;}
.btn-logout:hover{border-color:var(--gold);color:var(--gold);}

.app{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
.section-label{font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}

/* HERO */
.hero{background:linear-gradient(160deg,var(--surface),var(--ch2));border:1px solid rgba(212,175,55,0.25);border-radius:16px;padding:22px;margin-bottom:24px;}
.hero-top{display:flex;gap:12px;margin-bottom:18px;}
.hero-stat{flex:1;text-align:center;background:var(--ch3);border:1px solid rgba(212,175,55,0.12);border-radius:var(--radius);padding:12px 8px;}
.hero-stat .v{font-family:'Montserrat',sans-serif;font-weight:900;font-size:26px;color:var(--gold);line-height:1;margin-bottom:3px;}
.hero-stat .l{font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.progress-block{margin-bottom:16px;}
.progress-headline{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;margin-bottom:4px;}
.progress-headline span{color:var(--gold);}
.progress-sub{font-size:12px;color:var(--muted);margin-bottom:10px;}
.progress-track{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#b8932c,var(--gold));border-radius:4px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);}
.btn-journal-today{width:100%;background:var(--gold);color:var(--charcoal);border:none;border-radius:var(--radius-sm);padding:13px;font-family:'Open Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:background 0.18s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-journal-today:hover{background:#c9a42e;}

/* LESSON ACCORDION */
.lessons{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.lesson{background:var(--surface);border:1px solid rgba(212,175,55,0.14);border-radius:var(--radius);overflow:hidden;transition:border-color 0.2s;}
.lesson.open{border-color:rgba(212,175,55,0.4);}
.lesson.locked{opacity:0.85;}
.lesson-trigger{width:100%;display:flex;align-items:center;gap:12px;padding:16px 18px;background:none;border:none;cursor:pointer;text-align:left;color:#fff;}
.lesson-trigger:hover{background:rgba(255,255,255,0.03);}
.lesson.locked .lesson-trigger{cursor:default;}
.lesson.locked .lesson-trigger:hover{background:none;}
.lesson-icon{flex-shrink:0;width:28px;height:28px;border-radius:7px;background:var(--gold-dim);display:flex;align-items:center;justify-content:center;}
.lesson.locked .lesson-icon{background:rgba(255,255,255,0.06);}
.lesson-titlewrap{flex:1;min-width:0;}
.lesson-title{font-family:'Montserrat',sans-serif;font-weight:700;font-size:clamp(14px,2.5vw,16px);line-height:1.3;}
.lesson.locked .lesson-title{color:var(--locked);}
.lesson-status{font-size:11px;color:var(--muted);margin-top:2px;}
.lesson-status.unlock-soon{color:var(--gold);}
.lesson-chevron{flex-shrink:0;color:var(--gold);transition:transform 0.28s;}
.lesson.open .lesson-chevron{transform:rotate(180deg);}

.lesson-panel{max-height:0;overflow:hidden;transition:max-height 0.42s cubic-bezier(0.4,0,0.2,1);}
.lesson.open .lesson-panel{max-height:9999px;}
.lesson-inner{border-top:1px solid rgba(212,175,55,0.12);padding:18px;display:flex;flex-direction:column;gap:16px;}

/* locked panel */
.locked-body{text-align:center;padding:10px 4px;}
.locked-body .lock-big{margin-bottom:10px;}
.locked-body p{font-size:13px;color:var(--muted);line-height:1.6;max-width:320px;margin:0 auto;}
.locked-body .lock-progress{margin-top:14px;font-size:12px;color:var(--gold);font-weight:600;}

.video-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden;background:var(--ch3);}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.video-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;}
.video-placeholder svg{opacity:0.3;}
.lesson-desc{font-size:14px;color:rgba(255,255,255,0.65);line-height:1.7;font-style:italic;}

.content-toggles{display:flex;flex-direction:column;gap:8px;}
.ct{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ch2);border:1px solid rgba(212,175,55,0.18);border-radius:8px;padding:12px 16px;cursor:pointer;color:var(--gold);font-family:'Open Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.18s;text-align:left;}
.ct:hover{background:var(--gold-dim);border-color:var(--gold);}
.ct.open{background:var(--gold);color:var(--charcoal);border-color:var(--gold);}
.ct .ct-chev{transition:transform 0.25s;flex-shrink:0;}
.ct.open .ct-chev{transform:rotate(180deg);}
.cp{max-height:0;overflow:hidden;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1);}
.cp.open{max-height:9999px;}
.content-body{background:var(--ch3);border:1px solid rgba(212,175,55,0.1);border-top:none;border-radius:0 0 8px 8px;padding:18px;}
.content-body p{font-size:14px;color:rgba(255,255,255,0.82);line-height:1.75;margin-bottom:10px;}
.content-body p:last-child{margin-bottom:0;}
.summary-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
.summary-item:last-child{margin-bottom:0;}
.summary-item .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:9px;flex-shrink:0;}
.summary-item span{font-size:14px;color:rgba(255,255,255,0.85);line-height:1.7;}

/* AI prompt box */
.prompt-box{background:var(--ch3);border:1px solid rgba(212,175,55,0.1);border-top:none;border-radius:0 0 8px 8px;padding:18px;}
.prompt-box .prompt-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.prompt-box .prompt-text{font-size:14px;color:rgba(255,255,255,0.82);line-height:1.75;white-space:pre-wrap;margin-bottom:14px;}
.copy-btn{display:inline-flex;align-items:center;gap:7px;background:var(--gold-dim);border:1px solid rgba(212,175,55,0.3);color:var(--gold);font-family:'Open Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:8px 14px;border-radius:6px;cursor:pointer;transition:all 0.18s;}
.copy-btn:hover{background:var(--gold);color:var(--charcoal);border-color:var(--gold);}

/* JOURNAL block */
/* GO DEEPER (books) */
.deeper-block{background:var(--ch3);border:1px solid rgba(212,175,55,0.15);border-radius:var(--radius);padding:16px 18px;}
.deeper-block .d-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
.deeper-block .d-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
.book-link{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(212,175,55,0.08);color:var(--text);text-decoration:none;transition:color 0.18s;}
.book-link:first-of-type{border-top:none;}
.book-link:hover{color:var(--gold);}
.book-link .b-icon{flex-shrink:0;color:var(--gold);}
.book-link .b-title{font-family:'Montserrat',sans-serif;font-weight:600;font-size:14px;font-style:italic;}
.book-link .b-arrow{margin-left:auto;color:var(--muted);flex-shrink:0;}
.book-link:hover .b-arrow{color:var(--gold);}

/* BREATHWORK */
.breath-block{background:var(--ch3);border:1px solid rgba(212,175,55,0.15);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;}
.breath-block .br-icon{width:34px;height:34px;border-radius:8px;background:var(--gold-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.breath-block .br-text .br-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:2px;}
.breath-block .br-text .br-sub{font-size:13px;color:var(--muted);}

.journal-block{background:var(--ch2);border:1px solid rgba(212,175,55,0.25);border-radius:var(--radius);padding:18px;}
.journal-block .j-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.journal-block .j-prompt{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;line-height:1.45;margin-bottom:14px;}
.journal-block textarea{width:100%;background:var(--ch3);border:1px solid rgba(212,175,55,0.2);border-radius:var(--radius-sm);padding:14px;color:var(--text);font-family:'Open Sans',sans-serif;font-size:14px;line-height:1.7;resize:vertical;min-height:110px;outline:none;transition:border-color 0.2s;}
.journal-block textarea::placeholder{color:rgba(255,255,255,0.2);}
.journal-block textarea:focus{border-color:var(--gold);}
.j-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap;}
.j-count{font-size:11px;color:var(--muted);}
.btn{font-family:'Open Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border:none;border-radius:var(--radius-sm);padding:11px 22px;cursor:pointer;transition:all 0.18s;}
.btn-gold{background:var(--gold);color:var(--charcoal);}
.btn-gold:hover{background:#c9a42e;}
.j-saved{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gold);font-weight:600;}
.j-past-header{margin-top:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.j-past-header .lbl{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.j-past-header .ic{color:var(--gold);transition:transform 0.25s;}
.j-past-header.open .ic{transform:rotate(180deg);}
.j-past-list{display:none;flex-direction:column;gap:8px;margin-top:10px;}
.j-past-list.open{display:flex;}
.j-entry{background:var(--ch3);border:1px solid rgba(212,175,55,0.1);border-radius:var(--radius-sm);padding:12px;}
.j-entry .d{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
.j-entry .t{font-size:13px;color:rgba(255,255,255,0.75);line-height:1.6;white-space:pre-wrap;}

.divider{height:1px;background:rgba(212,175,55,0.08);margin:24px 0;}

/* REFLECTION */
.reflection-card{background:var(--surface);border:1px solid rgba(212,175,55,0.2);border-radius:var(--radius);overflow:hidden;margin-bottom:24px;}
.reflection-header{display:flex;align-items:center;gap:12px;padding:16px 20px;}
.reflection-header .r-icon{width:36px;height:36px;border-radius:8px;background:var(--gold-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.reflection-header h3{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;line-height:1.2;}
.reflection-header .r-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.reflection-locked{padding:0 20px 20px;}
.lock-bar{background:var(--ch3);border:1px dashed rgba(212,175,55,0.2);border-radius:var(--radius-sm);padding:16px;text-align:center;}
.lock-bar .lp{font-size:13px;color:var(--muted);margin-bottom:10px;}
.lock-bar .pt{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.lock-bar .pf{height:100%;background:var(--gold);border-radius:2px;transition:width 0.4s;}
.reflection-body{padding:0 20px 20px;display:none;}
.reflection-body.visible{display:block;}
.reflection-text{font-size:14px;line-height:1.8;color:rgba(255,255,255,0.82);white-space:pre-wrap;}
.reflection-text.loading{color:var(--muted);font-style:italic;}
.reflection-meta{margin-top:14px;padding-top:14px;border-top:1px solid rgba(212,175,55,0.1);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.reflection-meta .r-note{font-size:11px;color:var(--muted);}
.btn-outline{background:none;border:1px solid rgba(212,175,55,0.3);color:var(--gold);font-size:11px;}
.btn-outline:hover{background:var(--gold-dim);}

/* DOT GRID */
.dot-grid-wrap{background:var(--surface);border:1px solid rgba(212,175,55,0.12);border-radius:var(--radius);padding:16px;margin-bottom:20px;}
.dot-grid-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.dot-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;}
.dot{aspect-ratio:1;border-radius:3px;background:var(--ch3);border:1px solid rgba(255,255,255,0.06);}
.dot.filled{background:var(--gold);border-color:var(--gold);}
.dot.today{border-color:rgba(212,175,55,0.5);}
.dot-legend{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);}
.dot-legend-dot{width:8px;height:8px;border-radius:2px;background:var(--gold);}

.footer{text-align:center;padding:28px 20px;font-size:11px;color:rgba(255,255,255,0.18);letter-spacing:0.06em;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--charcoal);font-weight:700;font-size:13px;letter-spacing:0.04em;padding:10px 22px;border-radius:40px;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* UNLOCK OVERLAY */
#unlockOverlay{position:fixed;inset:0;background:rgba(10,10,10,0.92);backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px 16px;}
#unlockOverlay.show{display:flex;}
.unlock-card{width:100%;max-width:480px;background:linear-gradient(165deg,var(--surface),var(--ch2));border:1px solid var(--gold);border-radius:20px;padding:32px 28px;text-align:center;max-height:90vh;overflow-y:auto;}
.unlock-badge{width:64px;height:64px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.unlock-eyebrow{font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.unlock-card h2{font-family:'Montserrat',sans-serif;font-weight:900;font-size:24px;line-height:1.2;margin-bottom:14px;}
.unlock-message{font-size:15px;color:rgba(255,255,255,0.8);line-height:1.6;margin-bottom:20px;}
.unlock-reflection{background:var(--ch3);border:1px solid rgba(212,175,55,0.15);border-radius:var(--radius);padding:18px;text-align:left;margin-bottom:22px;}
.unlock-reflection .ur-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.unlock-reflection .ur-text{font-size:13px;line-height:1.75;color:rgba(255,255,255,0.82);white-space:pre-wrap;}
.unlock-reflection .ur-text.loading{color:var(--muted);font-style:italic;}
.btn-continue{width:100%;background:var(--gold);color:var(--charcoal);border:none;border-radius:var(--radius-sm);padding:14px;font-family:'Open Sans',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:background 0.18s;}
.btn-continue:hover{background:#c9a42e;}

@media(max-width:480px){
  .login-card{padding:28px 20px;}
  .hero{padding:18px;}
  .hero-stat .v{font-size:22px;}
  .dot-grid{gap:4px;}
  .unlock-card{padding:26px 20px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <p class="eyebrow">AWKN With Dan</p>
    <h1>Internal <span>Mastery</span></h1>
    <p class="login-sub">I show you how to see.</p>
    <div class="form-group">
      <label for="loginPass">Access Code</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="Enter your access code" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <div class="login-err" id="loginErr"></div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">Enter</button>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <header class="site-header">
    <div class="header-left">
      <p class="eyebrow">AWKN With Dan</p>
      <h1>Internal <span>Mastery</span></h1>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sign out</button>
  </header>

  <div class="app">
    <!-- HERO -->
    <div class="hero" id="hero"></div>

    <!-- DOT GRID (moved up — sits under hero) -->
    <div class="dot-grid-wrap">
      <div class="dot-grid-header">
        <span class="section-label" style="margin:0">Your Consistency — First 30 Days</span>
        <div class="dot-legend"><div class="dot-legend-dot"></div> Journaled</div>
      </div>
      <div class="dot-grid" id="dotGrid"></div>
    </div>

    <!-- LESSONS -->
    <div class="section-label">Your Journey</div>
    <div class="lessons" id="lessons"></div>

    <div class="divider"></div>

    <!-- REFLECTION -->
    <div class="reflection-card">
      <div class="reflection-header">
        <div class="r-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2L11.5 7L17 7.5L13 11.5L14.5 17L9 14L3.5 17L5 11.5L1 7.5L6.5 7L9 2Z" stroke="#D4AF37" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <h3>AI Pattern Reflection</h3>
          <p class="r-sub">Reads your recent entries and names what's running beneath them</p>
        </div>
      </div>

const TOKEN_KEY='awkn_token';
let currentUser='';

async function checkAuth(){
  const token=localStorage.getItem(TOKEN_KEY);
  if(!token){showLogin();return;}
  try{
    const res=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    const data=await res.json();
    if(data.valid){currentUser='client';showApp();}
    else{localStorage.removeItem(TOKEN_KEY);showLogin();}
  }catch{showLogin();}
}
async function doLogin(){
  const password=document.getElementById('loginPass').value;
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('loginErr');
  if(!password){err.textContent='Please enter your access code.';return;}
  btn.disabled=true;btn.textContent='Checking…';err.textContent='';
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
    const data=await res.json();
    if(res.ok){localStorage.setItem(TOKEN_KEY,data.token);currentUser='client';showApp();}
    else{err.textContent=data.error||'Incorrect access code.';}
  }catch{err.textContent='Something went wrong. Please try again.';}
  btn.disabled=false;btn.textContent='Enter';
}
function doLogout(){localStorage.removeItem(TOKEN_KEY);currentUser='';document.getElementById('loginPass').value='';showLogin();}

function todayStr(){return new Date().toISOString().slice(0,10);}
function formatDate(ds){return new Date(ds+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'});}
function activeDays(){return new Set(state.entries.map(e=>e.date)).size;}
function isUnlocked(l){return l.type==='intro'?true:activeDays()>=l.unlockAt;}
function entriesFor(id){return state.entries.filter(e=>e.promptId===id).sort((a,b)=>b.date.localeCompare(a.date));}
function hasTodayEntry(id){return state.entries.some(e=>e.promptId===id&&e.date===todayStr());}
function wordCount(t){return t.trim().split(/\s+/).filter(w=>w).length;}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function computeStreaks(){
  const days=[...new Set(state.entries.map(e=>e.date))].sort();
  if(!days.length)return{current:0,best:0};
  let best=1,run=1;
  for(let i=1;i<days.length;i++){
    const prev=new Date(days[i-1]+'T00:00:00'),cur=new Date(days[i]+'T00:00:00');
    const diff=Math.round((cur-prev)/86400000);
    if(diff===1){run++;best=Math.max(best,run);}else{run=1;}
  }
  let current=0;let check=new Date();check.setHours(0,0,0,0);
  const dset=new Set(days);
  for(let i=0;i<365;i++){
    const ds=check.toISOString().slice(0,10);
    if(dset.has(ds)){current++;}else if(current>0||i>0){break;}
    check.setDate(check.getDate()-1);
  }
  return{current,best};
}

    }else{
      const remaining=l.unlockAt-ad;
      statusHTML=`<div class="lesson-status unlock-soon">🔒 Unlocks in ${remaining} more ${remaining===1?'day':'days'}</div>`;
    }

    const iconHTML=unlocked
      ? `<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8L6.5 11.5L13 4" stroke="#D4AF37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4.5 7V5a3.5 3.5 0 017 0v2" stroke="rgba(255,255,255,0.35)" stroke-width="1.4" stroke-linecap="round"/><rect x="3" y="7" width="10" height="6.5" rx="1.5" stroke="rgba(255,255,255,0.35)" stroke-width="1.4"/></svg>`;

    let panelHTML;
    if(!unlocked){
      const remaining=l.unlockAt-ad;
      panelHTML=`<div class="lesson-inner"><div class="locked-body">
        <div class="lock-big"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M7 10V7a5 5 0 0110 0v3" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/><rect x="5" y="10" width="14" height="9" rx="2" stroke="#D4AF37" stroke-width="1.4" opacity="0.5"/></svg></div>
        <p>This lesson opens once you've journaled on ${l.unlockAt} separate days. Keep showing up — you're ${remaining} ${remaining===1?'day':'days'} away.</p>
        <div class="lock-progress">${ad} of ${l.unlockAt} days complete</div>
      </div></div>`;
    }else{
      const videoHTML=l.loomId
        ? `<iframe src="https://www.loom.com/embed/${l.loomId}?hide_owner=true&hide_share=true&hide_title=true&hideEmbedTopBar=true" allowfullscreen></iframe>`
        : `<div class="video-placeholder"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="#D4AF37" stroke-width="1.5"/><path d="M16 13L29 20L16 27V13Z" fill="#D4AF37"/></svg><span>Video coming soon</span></div>`;
      const scriptHTML=l.script.map(p=>`<p>${p}</p>`).join('');
      const summaryHTML=l.summary.map(s=>`<div class="summary-item"><div class="dot"></div><span>${s}</span></div>`).join('');

      let togglesHTML=`
        <button class="ct" onclick="toggleContent('sc',${jid(l.id)})">Full Script ${chev('ct-chev')}</button>
        <div class="cp" id="scp-${l.id}"><div class="content-body">${scriptHTML}</div></div>
        <button class="ct" onclick="toggleContent('qs',${jid(l.id)})">Quick Summary ${chev('ct-chev')}</button>
        <div class="cp" id="qsp-${l.id}"><div class="content-body">${summaryHTML}</div></div>`;
      if(l.type==='lesson' && l.aiPrompt){
        togglesHTML+=`
        <button class="ct" onclick="toggleContent('ai',${jid(l.id)})">Go Deeper With AI ${chev('ct-chev')}</button>
        <div class="cp" id="aip-${l.id}"><div class="prompt-box">
          <div class="prompt-label">Copy this into Claude or ChatGPT</div>
          <div class="prompt-text" id="pt-${l.id}">${l.aiPrompt}</div>
          <button class="copy-btn" onclick="copyPrompt(${jid(l.id)})"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1 9V2a1 1 0 011-1h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> Copy Prompt</button>
        </div></div>`;
      }

      let journalHTML='';
      if(l.type==='lesson'){
        const past=entriesFor(l.id);
        const savedToday=hasTodayEntry(l.id);
        const pastListHTML=past.map(e=>`<div class="j-entry"><div class="d">${formatDate(e.date)}</div><div class="t">${escHtml(e.text)}</div></div>`).join('');
        journalHTML=`
        <div class="journal-block" id="journal-${l.id}">
          <div class="j-label">✍️ Your Daily Practice</div>
          <div class="j-prompt">${l.journalPrompt}</div>
          <textarea id="ta-${l.id}" placeholder="${savedToday?"You've journaled on this today. Add more if you'd like, or come back tomorrow.":"Write freely — just what's true for you right now."}"></textarea>
          <div class="j-footer">
            <span class="j-count" id="jc-${l.id}">0 words</span>
            <div>${savedToday
              ? `<div class="j-saved"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#D4AF37" stroke-width="1.3"/><path d="M5 8L7 10L11 6" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Done for today ✓</div>`
              : `<button class="btn btn-gold" onclick="saveEntry(${jid(l.id)})">Save Entry</button>`}</div>
          </div>
          ${past.length?`
          <div class="j-past-header${openPast.has(l.id)?' open':''}" onclick="togglePast(${jid(l.id)})">
            <span class="lbl">Past Entries (${past.length})</span>${chev('ic')}
          </div>
          <div class="j-past-list${openPast.has(l.id)?' open':''}" id="jpl-${l.id}">${pastListHTML}</div>`:''}
        </div>`;
      }

      // Breathwork block (lessons only) — placeholder "coming soon" for now
      let breathHTML='';
      if(l.type==='lesson'){
        breathHTML=`
        <div class="breath-block">
          <div class="br-icon"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 17c3.5 0 6-2.5 6-5.5C16 8 13 4 10 3 7 4 4 8 4 11.5 4 14.5 6.5 17 10 17Z" stroke="#D4AF37" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 17V9" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round"/></svg></div>
          <div class="br-text">
            <div class="br-label">Breathwork Practice</div>
            <div class="br-sub">Coming soon</div>
          </div>
        </div>`;
      }

      // Go Deeper (books) — only shows if this lesson has books
      let booksHTML='';
      if(l.books && l.books.length){
        const links=l.books.map(b=>`
          <a class="book-link" href="${b.url}" target="_blank" rel="noopener">
            <span class="b-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3.5C3 2.7 3.7 2 4.5 2H13v10H4.5C3.7 12 3 12.7 3 13.5V3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M3 13.5C3 12.7 3.7 12 4.5 12H13v2H4.5C3.7 14 3 13.3 3 12.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span>
            <span class="b-title">${b.title}</span>
            <span class="b-arrow"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 10L10 4M10 4H5M10 4V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </a>`).join('');
        booksHTML=`
        <div class="deeper-block">
          <div class="d-label">Go Deeper</div>
          <div class="d-sub">The books that shaped this lesson</div>
          ${links}
        </div>`;
      }

      panelHTML=`<div class="lesson-inner">
        <div class="video-wrap">${videoHTML}</div>
        <p class="lesson-desc">${l.desc}</p>
        <div class="content-toggles">${togglesHTML}</div>
        ${breathHTML}
        ${booksHTML}
        ${journalHTML}
      </div>`;
    }

    item.innerHTML=`
      <button class="lesson-trigger" ${unlocked||l.type==='intro'?`onclick="toggleLesson(${jid(l.id)})"`:`onclick="toggleLesson(${jid(l.id)})"`}>
        <div class="lesson-icon">${iconHTML}</div>
        <div class="lesson-titlewrap">
          <div class="lesson-title">${l.title}</div>
          ${statusHTML}
        </div>
        ${chev('lesson-chevron')}
      </button>
      <div class="lesson-panel">${panelHTML}</div>`;
    wrap.appendChild(item);

    // re-attach word counter
    if(unlocked&&l.type==='lesson'){
      const ta=item.querySelector('#ta-'+l.id);
      if(ta)ta.addEventListener('input',function(){const c=item.querySelector('#jc-'+l.id);if(c)c.textContent=wordCount(this.value)+' words';});
    }
  });
}

function renderReflectionCard(){
  /* AI Pattern Reflection is "Coming Soon" — nothing to render dynamically for now. */
}

function renderDotGrid(){
  const grid=document.getElementById('dotGrid');grid.innerHTML='';
  const filled=new Set(state.entries.map(e=>e.date));
  const today=todayStr();
  // Anchor the 30-day window to the client's FIRST journal day so day 1 sits top-left
  // and the grid fills forward naturally. Before they start, anchor to today.
  let start;
  if(state.entries.length){
    start=[...filled].sort()[0]; // earliest journaled date
  }else{
    start=today;
  }
  const startDate=new Date(start+'T00:00:00');
  for(let i=0;i<30;i++){
    const d=new Date(startDate);d.setDate(startDate.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const isFuture=ds>today;
    const dot=document.createElement('div');
    dot.className='dot'+(filled.has(ds)?' filled':'')+(ds===today?' today':'');
    if(isFuture)dot.style.opacity='0.5';
    dot.title=formatDate(ds);
    grid.appendChild(dot);
  }
}

/* helper to safely pass ids (string 'intro' or number) into onclick */
function jid(id){return typeof id==='string'?`'${id}'`:id;}

/* ═══════════════════════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════════════════════ */
function toggleLesson(id){
  const item=document.getElementById('lesson-'+id);
  if(openLessons.has(id)){openLessons.delete(id);item.classList.remove('open');}
  else{openLessons.add(id);item.classList.add('open');}
}
function toggleContent(type,id){
  const panel=document.getElementById(`${type}p-${id}`);
  const btn=panel.previousElementSibling;
  const open=panel.classList.contains('open');
  panel.classList.toggle('open',!open);btn.classList.toggle('open',!open);
}
function togglePast(id){
  const list=document.getElementById('jpl-'+id);
  const header=list.previousElementSibling;
  if(openPast.has(id)){openPast.delete(id);}else{openPast.add(id);}
  list.classList.toggle('open');header.classList.toggle('open');
}
function copyPrompt(id){
  const text=document.getElementById('pt-'+id).textContent;
  navigator.clipboard.writeText(text);
  showToast('Prompt copied ✓');
}
function jumpToJournal(){
  const firstOpen=LESSONS.find(l=>l.type==='lesson'&&isUnlocked(l));
  if(!firstOpen)return;
  openLessons.add(firstOpen.id);
  renderLessons();
  const el=document.getElementById('journal-'+firstOpen.id);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});const ta=document.getElementById('ta-'+firstOpen.id);if(ta)setTimeout(()=>ta.focus(),400);}
}
function saveEntry(id){
  const ta=document.getElementById('ta-'+id);
  const text=ta.value.trim();
  if(!text){showToast('Write something first.');return;}
  if(wordCount(text)<5){showToast('Keep going — a few more words.');return;}

  const before=LESSONS.filter(l=>l.type==='lesson'&&isUnlocked(l)).map(l=>l.id);
  state.entries.push({id:Date.now().toString(),promptId:id,date:todayStr(),text});
  saveState();
  showToast('Entry saved ✓');

  const after=LESSONS.filter(l=>l.type==='lesson'&&isUnlocked(l)).map(l=>l.id);
  const newly=after.filter(x=>!before.includes(x)&&!state.seenUnlocks.includes(x));

  render();

  if(newly.length){
    const lesson=LESSONS.find(l=>l.id===newly[0]);
    state.seenUnlocks.push(lesson.id);saveState();
    openLessons.add(lesson.id);
    showUnlock(lesson);
  }
}

/* ═══════════════════════════════════════════════════════════
   UNLOCK OVERLAY
═══════════════════════════════════════════════════════════ */
function showUnlock(lesson){
  document.getElementById('unlockTitle').textContent=lesson.title;
  document.getElementById('unlockMessage').textContent=lesson.unlockMessage;
  document.getElementById('unlockOverlay').classList.add('show');
}
function closeUnlock(){
  document.getElementById('unlockOverlay').classList.remove('show');
  renderLessons();
}

/* ═══════════════════════════════════════════════════════════
   AI REFLECTION
═══════════════════════════════════════════════════════════ */
async function getReflection(textElId,noteElId){
  if(state.entries.length<3){
    const el=document.getElementById(textElId);
    if(el){el.className=textElId==='unlockReflection'?'ur-text':'reflection-text';el.textContent='Write a few more entries and your reflection will appear here.';}
    return;
  }
  const last14=[...state.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
  const textEl=document.getElementById(textElId);
  const noteEl=noteElId?document.getElementById(noteElId):null;
  const isUnlock=textElId==='unlockReflection';
  if(textEl){textEl.className=isUnlock?'ur-text loading':'reflection-text loading';textEl.textContent='Reading what you\'ve written…';}
  const formatted=last14.map(e=>{const l=LESSONS.find(x=>x.id===e.promptId);return `[${e.date} — ${l?l.title:'Entry'}]\nPrompt: ${l&&l.journalPrompt?l.journalPrompt:''}\nEntry: ${e.text}`;}).join('\n\n---\n\n');
  try{
    const res=await fetch('/api/reflect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries:formatted,count:last14.length})});
    if(!res.ok)throw new Error();
    const data=await res.json();
    if(textEl){textEl.className=isUnlock?'ur-text':'reflection-text';textEl.textContent=data.reflection;}
    if(noteEl)noteEl.textContent=`Based on your last ${last14.length} ${last14.length===1?'entry':'entries'}`;
  }catch{
    if(textEl){textEl.className=isUnlock?'ur-text':'reflection-text';textEl.textContent='Couldn\'t generate the reflection right now. Try again in a moment.';}
  }
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

checkAuth();
